
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BMI Calculator</title>

<style>

body{

    margin:0;

    padding:20px;

    font-family:Arial,sans-serif;

    text-align:center;

    min-height:100vh;

    background:
    linear-gradient(
    135deg,
    #4CAF50,
    #8BC34A,
    #CDDC39
    );
}

.schoolBanner{

    background:#1b5e20;

    color:white;

    font-size:42px;

    font-weight:bold;

    padding:15px;

    border-radius:15px;

    margin-bottom:20px;
}

.project{

    color:white;

    font-size:36px;

    font-weight:bold;

    margin-bottom:15px;
}

.container{

    background:white;

    max-width:800px;

    margin:auto;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0 0 20px rgba(
    0,
    0,
    0,
    0.3
    );
}

input{

    width:80%;

    padding:12px;

    margin:10px;

    font-size:20px;

    border-radius:8px;

    border:1px solid #ccc;
}

button{

    background:#2e7d32;

    color:white;

    border:none;

    padding:15px 30px;

    font-size:22px;

    border-radius:10px;

    cursor:pointer;
}

button:hover{

    background:#1b5e20;
}

#result{

    margin-top:20px;

    background:#f5f5f5;

    padding:20px;

    border-radius:15px;

    font-size:24px;
}

.footer{

    margin-top:20px;

    color:white;

    font-weight:bold;

    font-size:18px;
}

</style>

</head>

<body>

<div class="schoolBanner">

🏫 ALPINE PUBLIC SCHOOL, KHURJA

</div>

<div class="project">

📊 BMI CALCULATOR

</div>

<div class="container">

<h2>

Enter Your Details

</h2>

<input
id="name"
placeholder="Enter Name">

<br>

<input
id="height"
placeholder="Height in cm">

<br>

<input
id="weight"
placeholder="Weight in kg">

<br><br>

<button onclick="calculateBMI()">

Calculate BMI

</button>

<div id="result">

Enter details and calculate BMI.

</div>

</div>

<div class="footer">

Developed by Alpine Public School Students

</div>

<script>

async function calculateBMI(){

    const name =
    document.getElementById(
    "name"
    ).value;

    const height =
    document.getElementById(
    "height"
    ).value;

    const weight =
    document.getElementById(
    "weight"
    ).value;

    if(
        !name ||
        !height ||
        !weight
    ){

        alert(
        "Please fill all fields."
        );

        return;
    }

    const response =
    await fetch(
    "https://bmi-calculator-o97t.onrender.com/calculate",
    {

        method:"POST",

        headers:{
        "Content-Type":
        "application/json"
        },

        body:JSON.stringify({

            name:name,
            height:height,
            weight:weight

        })

    });

    const data =
    await response.json();

    document.getElementById(
    "result"
    ).innerHTML =

    `
    <h2>

    BMI Result

    </h2>

    <p>

    BMI:
    <b>${data.bmi}</b>

    </p>

    <p>

    Category:
    <b>${data.category}</b>

    </p>
    `;
}

</script>

</body>

</html>
